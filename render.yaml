services:
  - type: web
    name: jarawork
    runtime: node
    buildCommand: bun install && bun run build
    startCommand: bun run server/agent.ts
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CIRCLE_DEVELOPER_CONTROLLED_API_KEY
        sync: false
      - key: CIRCLE_ENTITY_SECRET
        sync: false
      - key: VITE_CONTRACT_ADDRESS
        sync: false
      - key: VITE_AGENT_WALLET_ID
        sync: false
      - key: VITE_AGENT_WALLET_SET_ID
        sync: false
      - key: VITE_AGENT_WALLET_ADDRESS
        sync: false
